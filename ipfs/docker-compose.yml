services:
  ipfs:
    image: ipfs/kubo:latest   
    container_name: ipfs_node
    ports:
      - "4001:4001"   # swarm
      - "5001:5001"   # API
      - "8080:8080"   # Gateway
    volumes:
      - ipfs_data:/data/ipfs
    networks:
      - hardhat-network

volumes:
  ipfs_data:
    driver: local

networks:
  hardhat-network:
    external: true
