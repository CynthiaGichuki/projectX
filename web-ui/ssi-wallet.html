<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credential Wallet</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>Credential Wallet</h1>
        
        <div class="form-section">
            <h2>Stored Credentials</h2>
            <select id="credential-select" size="5"></select>
        </div>

        <div class="form-section">
            <h2>Credential Details</h2>
            <label for="view-registry">Registry:</label>
            <input type="text" id="view-registry" readonly>
            
            <label for="view-did">DID:</label>
            <input type="text" id="view-did" readonly>
            
            <label for="view-name">Name:</label>
            <input type="text" id="view-name" readonly>
            
            <label for="view-course">Course:</label>
            <input type="text" id="view-course" readonly>
            
            <label for="view-issuedAt">Issued At:</label>
            <input type="text" id="view-issuedAt" readonly>
            
            <button id="delete-credential">Delete Credential</button>
            <button id="delete-credential-did">Delete Credential and DID</button>
        </div>
    </div>

    <script src="js/ssi-wallet.js"></script>
</body>
</html>
