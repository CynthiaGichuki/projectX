<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERC20 Token Interaction</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/web3.min.js"></script>
    <script src="js/generic-wallet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.6.8/dist/ethers.umd.min.js"></script>

</head>
<body>
    <div class="container">
        <h1>ERC20 Token Interaction</h1>
        <p>Current Balance: <span id="balance">0</span> MTK</p>
        <input type="text" id="recipient" placeholder="Recipient Address">
        <input type="number" id="amount" placeholder="Amount">
        <button id="transfer">Transfer</button>
        <button id="approve">Approve</button>
        <button id="balanceOf">Get Balance</button>
        <br><br>
        <button id="change_address">Change Address</button>
    </div>

    <!-- Popup for wallet selection -->
    <div id="wallet-popup" class="popup">
        <div class="popup-content">
            <h2>Select Wallet</h2>
            <select id="wallet-select" size="5"></select>
            <button id="select-wallet">Select</button>
        </div>
    </div>

    <script src="js/ERC20.js"></script>
</body>
</html>
