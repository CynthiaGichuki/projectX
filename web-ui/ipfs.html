<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPFS Upload and Download</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 10px;
    }
    .form-group input {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
    }
    .form-group button {
      padding: 10px 20px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .form-group button:hover {
      background-color: #0056b3;
    }
    #output {
      margin-top: 20px;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>IPFS Upload and Download</h1>
    
    <div class="form-group">
      <label for="uploadFile">Upload File to IPFS:</label>
      <input type="file" id="uploadFile">
      <button onclick="uploadFile()">Upload</button>
    </div>
    
    <div class="form-group">
      <label for="cid">Download File from IPFS:</label>
      <input type="text" id="cid" placeholder="Enter CID">
      <button onclick="downloadFile()">Download</button>
    </div>
    
    <div id="output"></div>
  </div>

  <script src="https://unpkg.com/ipfs-http-client/dist/index.min.js"></script>
  <script>
    const ipfs = window.IpfsHttpClient.create({ host: 'localhost', port: '5001', protocol: 'http' });

    async function uploadFile() {
      const fileInput = document.getElementById('uploadFile');
      const file = fileInput.files[0];

      if (!file) {
        alert('Please select a file to upload.');
        return;
      }

      const reader = new FileReader();
      reader.onload = async function(event) {
        const fileContent = new Uint8Array(event.target.result);
        try {
          const result = await ipfs.add(fileContent);
          const cid = result.cid.toString();
          document.getElementById('output').innerText = `File uploaded successfully. CID: ${cid}`;
        } catch (error) {
          console.error('Error uploading file:', error);
          document.getElementById('output').innerText = 'Error uploading file. Check console for details.';
        }
      };
      reader.readAsArrayBuffer(file);
    }

    async function downloadFile() {
      const cid = document.getElementById('cid').value.trim();

      if (!cid) {
        alert('Please enter a CID.');
        return;
      }

      try {
        const stream = ipfs.cat(cid);
        let content = '';

        for await (const chunk of stream) {
          content += new TextDecoder().decode(chunk);
        }

        const blob = new Blob([content], { type: 'application/octet-stream' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = cid;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        document.getElementById('output').innerText = 'File downloaded successfully.';
      } catch (error) {
        console.error('Error downloading file:', error);
        document.getElementById('output').innerText = 'Error downloading file. Check console for details.';
      }
    }
  </script>
</body>
</html>
