<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Credential</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>Verify Credential</h1>
        
        <div class="form-section">
            <h2>Stored Credentials</h2>
            <select id="credential-select" size="5"></select>
        </div>

        <div class="form-section">
            <h2>Credential Details</h2>
            <label for="verify-registry">Registry:</label>
            <input type="text" id="verify-registry" readonly>
            
            <label for="verify-did">DID:</label>
            <input type="text" id="verify-did" readonly>
            
            <label for="verify-name">Name:</label>
            <input type="text" id="verify-name">
            
            <label for="verify-course">Course:</label>
            <input type="text" id="verify-course">
            
            <label for="verify-issuedAt">Issued At:</label>
            <input type="text" id="verify-issuedAt" readonly>
            
            <button id="verify-credential">Verify Credential</button>
        </div>

        <div id="verification-result" class="result-section"></div>
    </div>

    <script src="js/verify.js"></script>
</body>
</html>
